; Internal AST/value records and native bindings are documented at module level;
; API entry points and the plugin ABI carry dedicated Ddoc comments.
[analysis.config.StaticAnalysisConfig]
undocumented_declaration_check="disabled"
; Mutation is part of the interpreter model; avoid const noise on every local.
could_be_immutable_check="disabled"
; Delegate signatures match the native ABI, including unused arguments.
unused_parameter_check="disabled"
